manifest:
  remotes:
    - name: nrfconnect
      url-base: https://github.com/nrfconnect

  projects:
    # Edge AI Add-on; its own manifest pulls nRF Connect SDK v3.4.1 and Zephyr.
    - name: edge-ai
      repo-path: sdk-edge-ai
      remote: nrfconnect
      revision: v3.0.0
      import: true
    # For bench/ only. Zephyr lists TFLM as optional; this is the revision it pins.
    - name: tflite-micro
      url: https://github.com/zephyrproject-rtos/tflite-micro
      revision: fcc760af130f3a595b5802cdebcc77461e54f382
      path: optional/modules/lib/tflite-micro

  self:
    path: axon-npu-demo
